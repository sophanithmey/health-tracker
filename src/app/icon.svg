  />

  <!-- Embedded Clinical Pulse Line inside Droplet -->
  <path
    d="M22 39H26.5L28.5 33.5L32 45L35 36.5L37 40H42"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Loving Heart Accent -->
  <path
    d="M45.5 16.5C44.4 15.4 42.6 15.4 41.5 16.5L40.5 17.5L39.5 16.5C38.4 15.4 36.6 15.4 35.5 16.5C34.4 17.6 34.4 19.4 35.5 20.5L40.5 25.5L45.5 20.5C46.6 19.4 46.6 17.6 45.5 16.5Z"
    fill="#f43f5e"
  />
